[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-data", "crates/game", "crates/headless", "crates/mapgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Pinned exactly; upgraded only between milestones (build-plan 2.2, batch 169).
bevy = { version = "=0.20.0", default-features = false }
csv = "1"
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sim = { path = "crates/sim" }
sim-data = { path = "crates/sim-data" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Bevy is slow unoptimized; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2
