[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-data", "crates/game", "crates/headless", "crates/mapgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Pinned exactly; upgraded only between milestones (build-plan 2.2, batch 169).
bevy = { version = "=0.20.0", default-features = false }
blake3 = "1"
csv = "1"
flate2 = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
sim = { path = "crates/sim" }
sim-data = { path = "crates/sim-data" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Our own crates keep line tables (panic backtraces with file:line) but no full debug info;
# dependencies get none. Debug info was most of each target/ dir on Windows (Logan, 2026-10-21).
[profile.dev]
debug = "line-tables-only"

# Bevy is slow unoptimized; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2
debug = false
