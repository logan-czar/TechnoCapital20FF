# Builder-authored hints for the North America crosswalk (P3, D605). Each one replaces the
# automatic seeds of a province its name and notes could not place. `units` are building blocks
# (geoBoundaries ADM2 names), `places` Natural Earth populated places, `seeds` lon,lat points;
# `add = true` keeps the automatic seeds as well. Hinted rows get confidence 0.85 and are listed
# in the QA report for review.

[review]
# D692: Little and Big Diomede meet by sea only (no Russia-US land border); since the giant
# split (D820) they are in US-0169 (cut from US-0004) and RU-0206 (cut from RU-0070)
sea_only = [["RU-0206", "US-0169"]]
# Known compromises listed in the QA report for Logan.
notes = [
    "CA-0003 York-Markham holds Scarborough and North York, which are in the City of Toronto: the Toronto economic region is split by Voronoi among Downtown Toronto (seeded at Toronto), Peel-Mississauga, York-Markham and Durham-Oshawa, and the York and Markham seeds sit closer to them. Left as is; a hint can move them to Downtown Toronto.",
    "CA-0058 Baffin-Iqaluit and CA-0059 Kivalliq-Kitikmeot split Nunavut (one economic region) by one straight Voronoi line through Ellesmere Island.",
]

# D689: the country's most populous place of the name is another town
[review.anchor_ok]
"US-0086" = "Natural Earth's only Manhattan is the Kansas town; New York City's point is checked as the Metro"
"MX-0001" = "Cuauhtemoc borough of Mexico City, not Cuauhtemoc in Chihuahua"

[regions]
"MEX:Ciudad de Mexico" = "MX-DIF"

[blocks]
# US county names in the notes are mostly ordinary words (Pacific port, Hill Country, citrus):
# a county named only in the notes counts only when a same-named place lies inside it or the
# phrase says county (D603).
notes_need_place = ["USA"]

