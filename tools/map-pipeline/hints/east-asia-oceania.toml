# Builder-authored hints for the East Asia and Oceania crosswalk (P3, D605, D673-D676).
# `[regions]` aliases name the Natural Earth admin-1 units a game region is drawn from
# (iso_3166_2 or adm1_code, `region:<NE region group>` or `name:<NE unit name>`); `[carve]`
# takes land a region's NE units do not give it from geoBoundaries units or a drawn polygon;
# `[provinces]` place provinces the automatic match could not (as in north-america.toml).

[review]
# provinces listed in the report's watched table (ids or id prefixes, or country codes)
watch = ["SG-", "HK-", "MO-", "CN-0001", "CN-0002", "CN-0003", "CN-0004", "TW-0020", "TW-0021", "TW-0022",
         "NRU", "TUV", "PLW", "KIR", "MHL", "FSM", "TON", "WSM", "BRN"]
# Natural Earth label check (D687): units whose capital point lies within a few km of
# the unit edge, so the place belongs to the neighbour; not a mislabel
ne_label_ok = [
    "THA:Sakon Nakhon-Roi Et-Mekong",  # Sakon Nakhon is its own capital; Samut Sakhon is a different name
]
notes = [
    "PG-0003 Eastern Highlands-Simbu-Jiwaka: Natural Earth still has Jiwaka inside Western Highlands, so Jiwaka is drawn in Enga-Western Highlands.",
    "VNM: Natural Earth labels three provinces with region names (VN-53 Bac Kan as Dong Bac, VN-39 Dong Nai as Dong Nam Bo, VN-66 Hung Yen as Dong Bang Song Hong); they are matched by code. Vinh Phuc, which no province names, is drawn with Hanoi.",
    "TW-0022 Matsu: Natural Earth 10m has no land for the Matsu islands; the province is a builder-drawn polygon around Nangan and Beigan (a click target).",
]

# D689: the country's most populous place of the name is another town
