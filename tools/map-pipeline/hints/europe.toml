# Builder-authored hints for the Europe crosswalk (P3, D605, D673-D677). Format as in
# east-asia-oceania.toml. Most aliases name the units of statistical regions (NUTS) that Natural
# Earth does not group; a `-<code>` entry leaves a unit out of a group.

[text]
# real cities here, stopwords in North America (Paris, Texas)
allow = ["paris", "athens", "berlin", "moscow"]

[review]
watch = ["GB-0001", "GB-0002", "GB-0003", "GB-0004", "AND", "LIE", "MCO", "SMR", "VAT", "GIB", "MLT", "LUX",
         "GGY", "JEY", "IMN", "FRO"]
notes = [
    "RUS:Donbas is drawn by our own province file (decision C): all of Luhansk oblast and the Russian-held part of Donetsk oblast, cut from Donetsk oblast by a builder-drawn line close to the 2015 contact line (Horlivka, Donetsk and Novoazovsk Russian; Mariupol, Kramatorsk and Sloviansk Ukrainian, UA-0016).",
    "RUS:Crimea follows Natural Earth's Crimea and Sevastopol units (Natural Earth already draws them in Russia).",
    "MD-0006 Transnistria takes Natural Earth's Transnistria and Stinga Nistrului units with Camenca, Grigoriopol, Bender and Ribnita (NE names it as a second Rezina unit).",
    "FR-0004: Natural Earth spells Seine-et-Marne \"Seien-et-Marne\", so the hint names the unit.",
    "CY-0005 Northern Cyprus is Natural Earth's Northern Cyprus (CYN) unit; the UN buffer zone and the British sovereign base areas belong to no province.",
]

[blocks.level]
# its four provinces are the blocks (ESP ADM2 is the same provinces under other names)
"ESP:Catalonia" = "admin1"

# D689: the country's most populous place of the name is another town
[review.anchor_ok]
"FR-0004" = "the file joins Yvelines and Seine-et-Marne, which do not touch; Versailles is in the smaller, Yvelines"
"CY-0003" = "the free part of Famagusta district; Famagusta town is in Northern Cyprus (CY-0005, decision C)"

