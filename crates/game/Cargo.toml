[package]
name = "game"
description = "The TechnoCapital20FF desktop app (Bevy)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Only what a window with bevy_ui and text needs (build-plan 2.1); no 3D, audio, gamepads or scenes.
bevy = { workspace = true, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
    "ui_api",
    "ui_bevy_render",
    "bevy_picking",
    "ui_picking",
] }
# Never with the `test-hooks` feature: the game reads only the views (spec 9; the gate's
# boundary step builds this crate without it).
sim.workspace = true
# The starting data the sim is built from (main.rs loads it; the synthetic map only receives what main.rs loaded).
sim-data.workspace = true
# The UI config file (layouts, columns, sections, density; D452): serde for the types and RON
# for a human-readable file. Bevy's asset crate already builds ron 0.12, so neither adds a crate
# to the build. The config dir is found from the platform's environment variables, no crate.
serde.workspace = true
ron = "0.12"
# The map's PNGs (M8): the 16-bit province index, the border field, and the synthetic test map
# (D634). Bevy's image loader already builds this crate.
png = "0.18"

[features]
# The benches' span timer (D770): Bevy's `trace` puts every system and render node in a span,
# and `game::profile` adds up their times. Off in every normal build.
profile = ["bevy/trace", "bevy/debug"]

[dev-dependencies]
# The map shader's layout test parses the WGSL (D741). wgpu already builds this exact naga with
# its WGSL front end, so it adds no crate to the build.
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }

[lints]
workspace = true
