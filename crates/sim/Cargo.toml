[package]
name = "sim"
description = "The TechnoCapital20FF simulation. No Bevy dependency (build-plan 2.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
flate2.workspace = true
postcard.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
serde.workspace = true
thiserror.workspace = true
sim-data.workspace = true

[features]
# Test-only access: `Sim::world()` (raw tables, which bypass the spec 9 views boundary) and
# `Sim::register_test_job`. Enabled only by sim's own tests (the dev-dependency below); the game
# must never enable it.
test-hooks = []

[dev-dependencies]
sim = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
