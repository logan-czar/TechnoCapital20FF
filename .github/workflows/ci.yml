name: CI

on:
  pull_request:
  push:
    branches: [main, design/detailed-stages]

jobs:
  data:
    name: Data validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate starting world data
        working-directory: docs/design/tools/mvp-data
        run: python3 -B validate.py ../../data

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not allowed in a job-level `if`, so the workspace check is a step.
      - name: Detect Cargo workspace
        id: ws
        shell: bash
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - name: Install Linux deps for Bevy
        if: steps.ws.outputs.present == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.present == 'true'
      - if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.ws.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.ws.outputs.present == 'true'
        run: cargo test --workspace
